name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试与构建
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装依赖
        run: npm install

      - name: 算法回归测试
        run: npm run test:algorithms

      - name: 构建
        run: npm run build

      - name: 诊断（仅失败时）
        if: failure()
        run: |
          echo "=== 环境信息 ==="
          node -v && npm -v
          echo "=== 平台二进制 ==="
          ls node_modules/@esbuild/ 2>&1 || true
          ls node_modules/@rollup/ 2>&1 || true
          echo "=== 重新构建并捕获错误 ==="
          set +e
          BUILD_OUT=$(npx vite build 2>&1)
          echo "$BUILD_OUT"
          # 把错误转成 annotation（公开可读，便于排查）
          FIRST_ERR=$(echo "$BUILD_OUT" | grep -iE "error|Error:" | head -3 | tr '
' ' ')
          echo "::error title=Vite构建错误::$FIRST_ERR"
          # 同时写入 summary
          {
            echo '### 构建诊断'
            echo '```'
            echo "$BUILD_OUT" | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 运行时冒烟测试
        run: npm run test:runtime

      - name: 上传构建产物
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
