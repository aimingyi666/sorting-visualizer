name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试与构建
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装依赖
        run: npm ci

      - name: 算法回归测试
        run: npm run test:algorithms

      - name: 构建
        run: npm run build

      - name: 运行时冒烟测试
        run: npm run test:runtime

      - name: 上传构建产物
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      # 构建失败时输出诊断信息
      - name: 诊断（仅失败时）
        if: failure()
        run: |
          exec 2>&1
          echo "node=$(node -v) npm=$(npm -v)"
          echo "--- esbuild 平台包 ---"
          ls node_modules/@esbuild/ || true
          echo "--- rollup 平台包 ---"
          ls node_modules/@rollup/ || true
          echo "--- vite build 详细输出 ---"
          npx vite build --debug > /tmp/vite.log 2>&1 || true
          cat /tmp/vite.log
          {
            echo '### 构建诊断'
            echo '```'
            head -80 /tmp/vite.log 2>/dev/null || echo '无日志'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
