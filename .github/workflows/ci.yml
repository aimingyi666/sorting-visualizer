name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试与构建
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装依赖
        run: npm ci

      - name: 算法回归测试
        run: npm run test:algorithms

      - name: 构建
        run: npm run build

      - name: 运行时冒烟测试
        run: npm run test:runtime

      - name: 上传构建产物
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      # 构建失败时把信息写入 job summary，便于排查
      - name: 诊断（仅失败时）
        if: failure()
        run: |
          {
            echo '### 诊断信息'
            echo ''
            echo '```'
            echo "node: $(node -v)"
            echo "npm: $(npm -v)"
            echo ''
            echo '--- @esbuild 平台包 ---'
            ls node_modules/@esbuild/ 2>&1 || true
            echo '--- @rollup 平台包 ---'
            ls node_modules/@rollup/ 2>&1 || true
            echo '--- 重新构建输出 ---'
            npx vite build 2>&1 | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
